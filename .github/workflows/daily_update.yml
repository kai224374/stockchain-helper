name: Daily Stock Data Update

on:
  schedule:
    # 每天台灣時間晚上 6 點 (UTC 10:00) 自動執行
    - cron: '0 10 * * *'
  workflow_dispatch:

# 賦予寫入倉庫內容的權限
permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: 檢出專案程式碼
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安裝爬蟲套件
        run: pip install requests pandas

      - name: 執行資料更新腳本
        run: python scripts/update_stocks.py

      - name: 自動 Commit 並 Push 最新 stocks.json
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add src/data/stocks.json
          git diff-index --quiet HEAD || git commit -m "Auto-update stock data [skip ci]"
          git push